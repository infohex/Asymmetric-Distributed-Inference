[package]
name = "adi-sim"
version = "0.1.0"
edition = "2021"
description = "Discrete-event simulator for the Asymmetric Distributed Inference scheduling mechanism"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
rand_distr = "0.4"
csv = "1"

[profile.release]
debug = 1
