[package]
name = "adi-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Discrete-event simulator for the Asymmetric Distributed Inference scheduling mechanism"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
adi-core = { path = "../crates/adi-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
rand_distr = "0.4"
csv = "1"
