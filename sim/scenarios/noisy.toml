# noisy: basic + log-normal throughput noise (sigma 0.3) on every node, every round.
# Shows how far V1 and V2 degrade when capacity fluctuates; k is swept in sweeps/noisy_k.toml.


name = "noisy"
seed = 1

[scheduler]
w = 1.0
alpha = 0.3
k = 1.0

[[nodes]]
id = "fast1"
r_true = 1000.0
b_true = 1.0e9
c = 16
latency = 0.01
noise_sigma = 0.3

[[nodes]]
id = "fast2"
r_true = 1000.0
b_true = 1.0e9
c = 16
latency = 0.01
noise_sigma = 0.3

[[nodes]]
id = "slow1"
r_true = 10.0
b_true = 1.0e8
c = 2
latency = 0.01
noise_sigma = 0.3

[[nodes]]
id = "slow2"
r_true = 10.0
b_true = 1.0e8
c = 2
latency = 0.01
noise_sigma = 0.3

[workload]
events = 10
units_per_event = 20000
unit_bytes = 1024
arrival = "sequential"
