[package]
name = "adi-submit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Submitter for Asymmetric Distributed Inference: generates matrices, uploads them, submits Events, assembles and verifies the result, collects metrics."

[dependencies]
adi-core = { path = "../adi-core" }
adi-scheduler = { path = "../adi-scheduler" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
