[package]
name = "adi-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scheduler service for Asymmetric Distributed Inference: registration, long-poll pull, report, content store, timeouts, metrics."

[[bin]]
name = "adi-scheduler"
path = "src/main.rs"

[dependencies]
adi-core = { path = "../adi-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
bytes = "1"
rand = "0.8"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
